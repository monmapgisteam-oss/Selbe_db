# Cloudflare Worker — Сэлбэ AI релений байршуулалт.
#
# ⚠️ ЭНД НУУЦ ТООЦООЛОЛ БИЧИХГҮЙ. `ANTHROPIC_API_KEY` нь Cloudflare-ийн нууц
#    хадгалалтад ордог тул энэ файл git-д ороход аюулгүй:
#        npx wrangler secret put ANTHROPIC_API_KEY
#
# Байршуулах:  cd agent-proxy && npx wrangler deploy
# Логоо харах: npx wrangler tail

name = "selbe-agent"
main = "worker.mjs"
compatibility_date = "2026-08-01"

[vars]
# ⚠️ Порталын БОДИТ хаягууд. Энд байхгүй эхээс ирсэн хүсэлтийг реле татгалзана.
# ⚠️ 2026-09-09: порталын домэйн `selbe.monmap.mn` → `smart.selbecity.mn` болов.
#    ШИНЭ хаягийг эхэнд нь нэмэв; хуучныг шилжилтийн үед үлдээв (хор хөнөөлгүй —
#    зөвхөн жагсаалтад байгаа эхээс ирсэн хүсэлт л нэвтэрнэ). Энэ өөрчлөлт
#    ЗӨВХӨН `npm run deploy` (wrangler) хийсний ДАРАА байршуулсан Worker-т хүрнэ —
#    файл засаад орхивол шинэ домэйн дээр AI туслах 403-оор хаагдсаар байна.
# ⚠️ 2026-10-09 (аудит №9): `http://localhost:8123` PRODUCTION жагсаалтаас ХАСАГДАВ — хэрэглэгчийн
#    машин дээрх дурын локал хуудас (8123 порт) нийтийн Worker-ийг дуудах боломжтой байв.
#    Локал `wrangler dev`-д `agent-proxy/.dev.vars` (жишээ: `.dev.vars.example`) — тэр нь
#    энэ утгыг ДАРНА. Локал хөгжүүлэлтэд ердийн зам нь `server.mjs` (анхдагч нь localhost).
# ⚠️ 2026-10-09: `https://monmapgisteam-oss.github.io` ХАСАГДАВ — портал өөрийн домэйноос
#    (`public/CNAME` = smart.selbecity.mn) үйлчилдэг; github.io эх нь ТУХАЙН байгууллагын БҮХ
#    GitHub Pages сайтад (өөр репо) хуваалцагддаг тул тэдгээрийн аль ч хуудас релег дуудаж чаддаг байв.
ALLOW_ORIGIN = "https://smart.selbecity.mn,https://selbe.monmap.mn"

# ⚠️ Энэ хувьсагчаар ArcGIS нэвтрэлт ШААРДАГДАНА: зөвхөн энэ байгууллагад нэвтэрсэн,
#    порталын эрхийн хүснэгтэд мөртэй хэрэглэгч AI-г ашиглана. ⚠️ 2026-10-21: хоосон бол реле
#    нээлттэй БОЛОХГҮЙ — бүх хүсэлтэд 503 (зөвхөн `BOT_SECRET` таарсан бот нэвтэрнэ).
# ⚠️ 2026-10-21: Сэлбэ Enterprise (gis.selbecity.mn/geoportal)-ийн байгууллага — AGOL (HJzgwvlNIXssnQar) хасагдсан.
#    Портал Enterprise токен олгодог тул AGOL-оор шалгавал бүх хэрэглэгчид 401 (мөн токен arcgis.com руу явдаг байв).
ARCGIS_ORG_ID = "0123456789ABCDEF"

# ⚠️ `monmap.maps.arcgis.com` БИШ — порталын `AUTH.portalUrl`-тэй ЯГ ижил байх ёстой,
#    эс бөгөөс токен өөр порталынх болж шалгалт унана.
ARCGIS_PORTAL = "https://gis.selbecity.mn/geoportal"

# ⚠️ 2026-10-21 (аудит): нэг байгууллагатай Enterprise дээр ARCGIS_ORG_ID нь «порталын хэрэглэгч» гэсэн баталгаа БИШ —
#    геопорталд нэвтэрсэн хэн ч тэр orgId-тай. Реле токеныг баталсны дараа ХЭРЭГЛЭГЧИЙН ӨӨРИЙН токеноор энэ хүснэгтээс
#    мөрийг нь (username) асууна: мөргүй/устгагдсан → 403. Хүснэгт хэрэглэгчдэд уншигдахаар хуваалцагдсан байх ёстой
#    (портал өөрөө ч ийм уншдаг). ARCGIS_ORG_ID ХООСОН бол реле ботоос бусдад 503 (урьд нээлттэй байв).
ARCGIS_PERMS_URL = "https://gis.selbecity.mn/map/rest/services/Hosted/SYS_Selbe_Permissions/FeatureServer/230"

# ⚠️ TELEGRAM БОТЫН НУУЦ — энд БИЧИХГҮЙ, НУУЦ болгож тавина:
#     npx wrangler secret put BOT_SECRET
# Бот нь ArcGIS хэрэглэгч биш тул `x-bot-secret` толгойгоор энэ утгаар батална
# (`worker.mjs`). Тохируулсан үед ArcGIS токенгүйгээр реле рүү хандах цорын ганц
# зам нь энэ нууц — санамсаргүй урт утга сонго (`openssl rand -hex 32`).
# Тохируулаагүй бол бот энэ реле рүү холбогдож чадахгүй (401); портал хэвээр.

# ⚠️ 2026-10-09: ӨДРИЙН ТОКЕНЫ ТӨСӨВ хэрэглэгч бүрд (`rateLimit.mjs`) — хэтэрвэл маргааш хүртэл 429.
#    Анхдагч 300000; "0" бол унтраалттай. Бот (`BOT_SECRET`) чөлөөт.
#    ⚠️ 2026-10-09: хүсэлтийн ӨМНӨ тооцоог (оролт ≈ байт/2 + 10000) урьдчилан хасаж, хариуны дараа
#    бодитоор тааруулна; бот `x-bot-user` илгээвэл Telegram хэрэглэгч бүр (`bot:<id>`) төсөвтэй —
#    зөвхөн толгойгүй хуучин бот чөлөөт. Дуудагч бүрд ЗЭРЭГ 2 хүсэлт (isolate тус бүрд — бүрэн хил
#    биш; бүрэн хил хэрэгтэй бол Durable Object, README «Хязгаарлалтын хил»).
DAILY_TOKEN_BUDGET = "300000"

# ⚠️ 2026-10-09: СИСТЕМИЙН ЗААВРЫН ГАРЫН ҮСЭГ (заавал биш) — энд БИЧИХГҮЙ, НУУЦ болгоно:
#     npx wrangler secret put PROMPT_HMAC
# Тохируулбал порталын build-д ИЖИЛ утгыг GitHub Variable `AGENT_PROMPT_HMAC` →
# `NEXT_PUBLIC_AGENT_PROMPT_HMAC`-аар өгнө (JS багцад ИЛ — хил биш, саад; README).
# Хоёр талын утга зөрвөл порталын AI бүх асуултад 403 буцаана.

# Загвар ба гүнзгийрэл — `server.mjs`-ийн анхдагчтай ижил.
# Туршилтын үед зардал хэмнэхийг хүсвэл AGENT_MODEL = "claude-haiku-4-5"
# ⚠️ 2026-10-19: `claude-opus-5` → `claude-opus-5-5`; effort "low" → "medium" — `worker.mjs` · `server.mjs`-ийн
#    анхдагчтай ИЖИЛ (урьд нь "low" нь шинэ анхдагчийг дардаг байв). Opus 5.5 дээр бодолтыг унтраах боломжгүй —
#    хурдыг ЗӨВХӨН effort-оор ("low") удирдана.
AGENT_MODEL = "claude-opus-5-5"
AGENT_EFFORT = "medium"

# ── Хурдны хязгаар ба төсвийн KV (⚠️ 2026-10-09; PRODUCTION-Д ЗААВАЛ — ⚠️ 2026-10-21) ─────────────────
# Холбосон үед `worker.mjs` нь хэрэглэгчийн минутын хязгаар, амжилтгүй нэвтрэлт ба
# өдрийн төсвийг isolate ХООРОНД тоолно (ойролцоо — KV eventually consistent).
# ⚠️ 2026-10-21 (аудит): ХОЛБООГҮЙ бол төсөв isolate тус бүрд тэглэгддэг тул бодит хязгаар = тохируулсных × isolate-ийн
#    тоо (хязгаарлалт бараг байхгүй). Тэр үед Worker isolate бүрд нэг удаа чанга анхааруулж (`wrangler tail`), isolate
#    доторх төсвийг ½ болгоно — реле ажилласаар (эвдэхгүй). Нийтэд гаргасан Worker-т KV-г ЗААВАЛ холбоно. Үүсгэх:
#     npx wrangler kv namespace create RL_KV
# гаралтын `id`-г доор тавиад идэвхжүүлнэ:
#
# [[kv_namespaces]]
# binding = "RL_KV"
# id = "<kv namespace id>"

# ── Өөрийн домэйн (заавал биш) ───────────────────────────────────────────
# Cloudflare дээр `selbecity.mn` бүсийг нэмсэн бол доорхийг идэвхжүүлээд
# `NEXT_PUBLIC_AGENT_API`-г https://api.smart.selbecity.mn болгоно.
# Идэвхжүүлэхгүй бол ажлын хаяг нь https://selbe-agent.<нэр>.workers.dev болно.
# (2026-09-09-өөс өмнө `monmap.mn` бүс / `api.selbe.monmap.mn` байв.)
#
# [[routes]]
# pattern = "api.smart.selbecity.mn/*"
# zone_name = "selbecity.mn"
