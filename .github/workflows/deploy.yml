name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

# Pages рүү нэг л удаа зэрэг deploy хийнэ
# ⚠️ 2026-10-01 («хэрэглэгч: бүгдийг зас»): `cancel-in-progress: false` — ЯВЖ БУЙ
#    deploy-г ТАСЛАХГҮЙ. Урьд `true` байсан тул ойр ойрхон push хийхэд Pages-ийн
#    байршуулалт дундаа цуцлагдаж, сайт хуучин/хагас төлөвт үлдэх эрсдэлтэй байв.
#    Одоо шинэ ажил дараалалд хүлээнэ; хүлээж буй ажлыг GitHub хамгийн сүүлийн
#    push-оор солино — эцэст нь сүүлийн commit л байршина.
concurrency:
  group: pages
  cancel-in-progress: false

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    # ⚠️ 2026-09-29: env нь JOB түвшинд — доорх `test` ба `build` ХОЁУЛАА хэрэглэнэ.
    #    Код дотор үйлчилгээний линк/fallback ОГТ БАЙХГҮЙ (2026-09-17) — доорх бүх
    #    хувьсагч Variables-д ЗААВАЛ байна (нэр кодынхтой ИЖИЛ). Аль нэг нь дутуу
    #    бол `services.ts req()` typecheck-ийн дараах ЭХНИЙ алхмыг ил алдаагаар унагана.
    env:
      # ⚠️ AI релений хаяг. Repo → Settings → Secrets and variables → Actions
      #    → Variables таб дээр `AGENT_API` нэрээр нэмнэ (ЖИШЭЭ:
      #    https://selbe-agent.<нэр>.workers.dev).
      #    Нөөц хост (2026-09-28): таслалаар хэд хэдэн хаяг — үндсэн ба нөөц
      #    Claude Code хост (жиш.
      #    https://monmap.<tailnet>.ts.net,https://desktop-xxx.<tailnet>.ts.net).
      #    Эхнийх нь үндсэн; унтарвал browser дараагийнх руу шилжинэ
      #    (`src/lib/agent/client.ts` → `relayFetch`).
      #
      # ⚠️ Secret БИШ, Variable: энэ бол зүгээр нэг нийтийн URL бөгөөд
      #    build-ийн үр дүнд JS багцад ил бичигдэнэ. Түлхүүр нь релены
      #    дотор л үлдэнэ.
      #
      # ⚠️ Тохируулаагүй бол хоосон үлдэж, deploy хийсэн сайт дээр AI
      #    ажиллахгүй (бусад бүх хэсэг хэвийн) — энэ нэг нь deploy-г УНАГААХГҮЙ.
      NEXT_PUBLIC_AGENT_API: ${{ vars.AGENT_API }}
      NEXT_PUBLIC_AUTH_APP_ID: ${{ vars.NEXT_PUBLIC_AUTH_APP_ID }}
      NEXT_PUBLIC_PORTAL_URL: ${{ vars.NEXT_PUBLIC_PORTAL_URL }}
      NEXT_PUBLIC_ALLOWED_ORG_ID: ${{ vars.NEXT_PUBLIC_ALLOWED_ORG_ID }}
      NEXT_PUBLIC_ARCGIS_HJ: ${{ vars.NEXT_PUBLIC_ARCGIS_HJ }}
      NEXT_PUBLIC_ARCGIS_GAZAR: ${{ vars.NEXT_PUBLIC_ARCGIS_GAZAR }}
      NEXT_PUBLIC_UBHUB_SCENE: ${{ vars.NEXT_PUBLIC_UBHUB_SCENE }}
      NEXT_PUBLIC_ELEVATION_URL: ${{ vars.NEXT_PUBLIC_ELEVATION_URL }}
      NEXT_PUBLIC_ARCGIS_IOT: ${{ vars.NEXT_PUBLIC_ARCGIS_IOT }}
      NEXT_PUBLIC_ROAD_TILE_URL: ${{ vars.NEXT_PUBLIC_ROAD_TILE_URL }}
      NEXT_PUBLIC_REPORT_RECIPIENTS: ${{ vars.NEXT_PUBLIC_REPORT_RECIPIENTS }}
      # ХАБЭА Survey123 үйлчилгээний нэрс (маягт дахин нийтлэхэд нэр солигддог)
      NEXT_PUBLIC_HABEA_LABOR_SVC: ${{ vars.NEXT_PUBLIC_HABEA_LABOR_SVC }}
      NEXT_PUBLIC_HABEA_INCIDENT_SVC: ${{ vars.NEXT_PUBLIC_HABEA_INCIDENT_SVC }}
      NEXT_PUBLIC_HABEA_UZLEG_V11_SVC: ${{ vars.NEXT_PUBLIC_HABEA_UZLEG_V11_SVC }}
      NEXT_PUBLIC_HABEA_UZLEG_G_SVC: ${{ vars.NEXT_PUBLIC_HABEA_UZLEG_G_SVC }}
      NEXT_PUBLIC_HABEA_UZLEG_ZAHIALAGCH_SVC: ${{ vars.NEXT_PUBLIC_HABEA_UZLEG_ZAHIALAGCH_SVC }}
      # ⚠️ Амьд өгөгдлийн шалгуурууд энэ токенгүй бол SELBE_LIVE_SKIP-ээр АЛГАСАГДАНА
      #    (унах боломжгүй). Settings → Secrets → Actions-д ARCGIS_ADMIN_TOKEN нэмнэ.
      ARCGIS_ADMIN_TOKEN: ${{ secrets.ARCGIS_ADMIN_TOKEN }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # ⚠️ 2026-09-29: ДӨРВӨН ХААЛТ deploy-ийн ӨМНӨ. Урьд нь энд зөвхөн typecheck + build
      #    байж, тест нь ТУСДАА `test.yml`-д (deploy-г хаадаггүй) явдаг байв —
      #    унасан тесттэй commit шууд сайт болдог. Одоо CLAUDE.md-ийн 4 шалгалт
      #    (tsc · eslint · npm test · i18n) бүгд энд: аль нэг нь унавал `build`
      #    хүрэхгүй, Pages хөндөгдөхгүй.
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run i18n:check
      - run: npm test

      # next.config.mjs дахь output:'export' → out/ хавтас үүснэ (CNAME, .nojekyll нь public/-оос)
      - run: npm run build

      # ⚠️ `enablement: true` — Pages УНТРААЛТТАЙ байвал workflow ӨӨРӨӨ асаана
      #    (дээрх `pages: write` эрхээр API дуудна). Ингэснээр Settings → Pages
      #    рүү гараар орох шаардлагагүй бөгөөд repo дахин үүсгэсэн ч сэргэнэ.
      #    ⚠️ PRIVATE repo дээр Pages нь төлбөртэй төлөвлөгөө шаардана —
      #    үнэгүй төлөвлөгөөнд энэ алхам «Resource not accessible» гэж унана.
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v4
