name: Sync (зураг → төлбөрийн акт → ТТБ, олгосон дүнгийн тэнцэл)

# Хүний оролцоогүй синк (tools/sync-all.mjs): хөтөч нээгдээгүй үед ч өгөгдөл 15 мин тутам тэнцэнэ.
# Олгосон дүн IPC ба ТТБ-д зөрвөл нэг удаа дахин засна; засагдахгүй бол ажиллагаа улаан болно.
# Шаардлага (нэг удаа): Secrets — ARCGIS_SYNC_USER, ARCGIS_SYNC_PASS (бичих эрхтэй үйлчилгээний аккаунт).

on:
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      NEXT_PUBLIC_PORTAL_URL: ${{ vars.NEXT_PUBLIC_PORTAL_URL }}
      NEXT_PUBLIC_ENT_DATA: ${{ vars.NEXT_PUBLIC_ENT_DATA }}
      NEXT_PUBLIC_ENT_PORTAL_URL: ${{ vars.NEXT_PUBLIC_ENT_PORTAL_URL }}
      NEXT_PUBLIC_ALLOWED_ORG_ID: ${{ vars.NEXT_PUBLIC_ALLOWED_ORG_ID }}
      ARCGIS_SYNC_USER: ${{ secrets.ARCGIS_SYNC_USER }}
      ARCGIS_SYNC_PASS: ${{ secrets.ARCGIS_SYNC_PASS }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      - run: node --experimental-transform-types --import ./tools/ts-alias.mjs tools/sync-all.mjs
