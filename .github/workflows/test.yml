name: Test (typecheck + live-data checks)

# ⚠️ Deploy-оос ТУСДАА, түүнийг ХААХГҮЙ workflow. Амьд ArcGIS үйлчилгээ рүү
# хандаж кодын өгөгдлийн таамгийг шалгадаг тул мэдээлэл өөрчлөгдөхөд эрт барина.
# (deploy.yml нь зөвхөн typecheck + build хийж, статикаар нийтэлдэг хэвээр.)

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      - run: npm run typecheck
      # ESLint (Next core-web-vitals + TS) — warning зөвшөөрнө, error унагана
      - run: npm run lint
      # ⚠️ `test:agent`/`test:drift` нь agent-proxy реле (server.mjs)-г асаадаг —
      #    тэр нь `@anthropic-ai/sdk`-г import хийдэг тул agent-proxy-ийн тусдаа
      #    хамаарлыг суулгана (root `npm ci` үүнийг ХАМАРДАГГҮЙ). Реле нь тестэд
      #    ХУУРАМЧ загвар руу чиглэдэг тул жинхэнэ түлхүүр шаардлагагүй.
      - run: npm ci
        working-directory: agent-proxy
      # Амьд өгөгдлийн шалгалтууд (filters/series/blockProgress/bagts/monitor/floor
      #  + agent реле + өгөгдлийн ХАЗАЙЛТ)
      - run: npm test
