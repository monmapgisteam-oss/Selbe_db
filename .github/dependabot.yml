# ⚠️ 2026-10-26 (аудит T5): npm хамаарлын долоо хоног тутмын шинэчлэлт — minor/patch нь НЭГ PR-д бүлэглэгдэнэ.
#    Dependabot-ийн PR нь secret авдаггүй (`test.yml` — амьд шалгуур алгасна, нэгж шалгуур + build хэвээр явна).
#    `next`-ийн МАЖОР (16+) шинэчлэлтийг хаана: `output: 'export'` · eslint-config-next · React 19-ийн нийцлийг
#    гараар шалгаж шилжинэ (`npm audit fix --force` нь next@16 санал болгодог — тэр нь санаатай алхам, автомат биш).
#    PR-ыг merge хийх эсэхийг хүн шийднэ (commit/merge-ийг автоматаар хийхгүй).
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
      timezone: Asia/Ulaanbaatar
    open-pull-requests-limit: 5
    groups:
      npm-minor-patch:
        update-types:
          - minor
          - patch
    ignore:
      - dependency-name: next
        update-types:
          - version-update:semver-major
  # 2026-11-23 (аудит №51): релейн хамаарал (`@anthropic-ai/sdk`, `wrangler`), SHA-гаар бэхэлсэн GitHub Actions,
  #    Telegram ботын Docker суурь — урьд нь зөвхөн үндсэн npm хамрагддаг байв.
  - package-ecosystem: npm
    directory: /agent-proxy
    schedule:
      interval: weekly
      day: monday
      timezone: Asia/Ulaanbaatar
    open-pull-requests-limit: 3
    groups:
      relay-minor-patch:
        update-types:
          - minor
          - patch
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      timezone: Asia/Ulaanbaatar
    open-pull-requests-limit: 3
  - package-ecosystem: docker
    directory: /deploy/telegram-bot
    schedule:
      interval: weekly
      day: monday
      timezone: Asia/Ulaanbaatar
    open-pull-requests-limit: 2
